<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">경영 파르테논 세계관</title>
  <desc id="desc">세상 흐름 안에 시장이 있고, 시장 안에서 사업이 돈과 추진체계 두 기둥 위에 서며 관리가 받치는 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f2e8"/><stop offset="1" stop-color="#e8eef2"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <ellipse cx="600" cy="382" rx="548" ry="326" fill="none" stroke="#4b6575" stroke-width="3"/>
  <text x="600" y="82" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="25" font-weight="700" fill="#2d4657">세상 흐름 · 기술 · 정치 · 경제 · 사회 · 문화 · 역사</text>
  <ellipse cx="600" cy="400" rx="454" ry="268" fill="#ffffffaa" stroke="#7d927f" stroke-width="3"/>
  <text x="600" y="155" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="25" font-weight="700" fill="#4d684f">시장 · 고객 · 경쟁 · 돈 냄새 · 신사업</text>
  <g filter="url(#shadow)">
    <path d="M340 300 L600 205 L860 300 Z" fill="#173f55"/>
    <text x="600" y="277" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="800" fill="white">사업</text>
    <rect x="360" y="310" width="205" height="260" rx="14" fill="#e9b949"/>
    <text x="462" y="365" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="34" font-weight="800" fill="#3a321e">돈</text>
    <text x="462" y="410" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="19" fill="#3a321e">일계표 · 통장 · 세금</text>
    <text x="462" y="442" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="19" fill="#3a321e">관리회계 · 원가회계</text>
    <text x="462" y="474" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="19" fill="#3a321e">급여 · 대여금 · IR</text>
    <rect x="635" y="310" width="205" height="260" rx="14" fill="#6f91a4"/>
    <text x="738" y="362" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="28" font-weight="800" fill="white">추진체계</text>
    <text x="738" y="408" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="19" fill="white">사람 · AI · 로봇</text>
    <text x="738" y="440" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="19" fill="white">차량 · 장비 · 비품</text>
    <text x="738" y="472" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="19" fill="white">계약 · 채용 · 평가</text>
    <rect x="318" y="586" width="564" height="88" rx="14" fill="#365d50"/>
    <text x="600" y="625" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="30" font-weight="800" fill="white">관리</text>
    <text x="600" y="654" text-anchor="middle" font-family="Apple SD Gothic Neo,sans-serif" font-size="18" fill="#eaf2ed">상태 · 손익 · 자산 · 일정 · 책임 · 완료</text>
  </g>
</svg>
